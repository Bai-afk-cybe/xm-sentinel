name: xm-sentinel

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xm-sentinel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow（装不上也不拦，脚本有纯 Python 解码兜底）
        run: pip install Pillow || true

      - name: 哨兵巡检一轮
        env:
          XM_FTQQ_KEY: ${{ secrets.XM_FTQQ_KEY }}
        run: python xm_sentinel.py

      - name: 回写状态（供下一轮续接 last_push / near5 等记忆）
        run: |
          git config user.name  "xm-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "state @ $(date -u '+%F %T')"
            git push
          fi
