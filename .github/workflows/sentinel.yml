name: xm-sentinel

on:
  schedule:
    - cron: "*/6 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xm-sentinel
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 Pillow（装不上也不拦，脚本有纯 Python 解码兜底）
        run: pip install Pillow || true

      - name: 解码订阅镜像（如有上一轮的）
        env:
          K: ${{ secrets.XM_FTQQ_KEY }}
        run: |
          if [ -f mirror.enc ]; then
            python -c "import base64,os; k=os.environ['K'].encode(); d=base64.b64decode(open('mirror.enc','rb').read()); open('subscribers.json','wb').write(bytes(b ^ k[i % len(k)] for i, b in enumerate(d)))"
          fi

      - name: 哨兵巡检一轮
        env:
          XM_FTQQ_KEY: ${{ secrets.XM_FTQQ_KEY }}
        run: python xm_sentinel.py

      - name: 加密并回写状态
        env:
          K: ${{ secrets.XM_FTQQ_KEY }}
        run: |
          if [ -f subscribers.json ]; then
            python -c "import base64,os; k=os.environ['K'].encode(); d=open('subscribers.json','rb').read(); open('mirror.enc','wb').write(base64.b64encode(bytes(b ^ k[i % len(k)] for i, b in enumerate(d))))"
            rm -f subscribers.json
          fi
          git config user.name  "xm-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
          else
            git commit -m "state @ $(date -u '+%F %T')"
            git push
          fi
